spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
animal.api.service-key=${serviceKey:}

spring.datasource.url=jdbc:mysql://localhost:3306/pawchain?useSSL=false&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# LocalDateTime → ISO-8601 문자열로 직렬화 (배열 대신)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

server.port=8080
server.error.include-message=always
server.error.include-exception=true
server.error.include-stacktrace=always

# AES-256-CBC 암호화 키 (정확히 32자 필수)
aes.secret-key=${AES_SECRET_KEY:pawchain-aes-256-secret-key-32ch}
jwt.secret=${JWT_SECRET:pawchain-secret-key-change-in-production-2024}
jwt.expiration-ms=86400000

# 앱 기본 URL - SBT tokenURI 생성에 사용
app.base-url=${APP_BASE_URL:http://localhost:8080}

# AWS S3 이미지 업로드
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket-name=${AWS_S3_BUCKET:pawchain-images}
# AWS 자격증명은 환경변수 AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY 또는 IAM Role 사용
# aws.access-key-id=${AWS_ACCESS_KEY_ID:}
# aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# 멀티파트 파일 업로드 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
